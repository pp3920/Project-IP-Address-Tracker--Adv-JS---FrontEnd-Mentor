<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />

    <title>IP Address Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>


</head>

<body>
    <main>
        <header>
            <h1>IP Address Tracker</h1>
            <div class="searchIP">
                <input type="text" class="input" placeholder="Search for IP address or domain">
                <div class="arrow">
                    <image src="images/icon-arrow.svg" alt="imageArrow">
                </div>

            </div>
            <div class="data-container">
                <div class="data">
                    <div class="info-title"> IP Address</div>
                    <div class="info">24.48.0.1</div>
                </div>

                <div class="data">
                    <div class="info-title">Location</div>
                    <div class="info">New York, NY, US</div>
                </div>
                <div class="data">
                    <div class="info-title"> Timezone </div>
                    <div class="info"> UTC -05:00 </div>
                </div>

                <div class="data">
                    <div class="info-title"> ISP</div>
                    <div class="info"> Cldfare </div>
                </div>
            </div>
            </div>

        </header>
        <div id="map"></div>
    </main>

</body>

</html>
